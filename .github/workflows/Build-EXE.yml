name: Build FileHubVN EXE

on:

  workflow_dispatch:

jobs:

  build:

    runs-on: windows-latest

    steps:

      - name: Checkout source

        uses: actions/checkout@v4

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: '3.11'

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          pip install pyinstaller

      - name: Build EXE

        run: |

          pyinstaller --noconfirm --clean --onefile --windowed --name FileHubVN main.py

      - name: Upload EXE

        uses: actions/upload-artifact@v4

        with:

          name: FileHubVN-Windows

          path: dist/FileHubVN.exe
 
